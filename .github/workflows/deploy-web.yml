name: Deploy Flutter web app

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9

      - name: Create web runtime configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" > .env
          printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY" >> .env
          printf 'PAYSTACK_CALLBACK_URL=https://locallekker.github.io/\n' >> .env
          printf 'PAYSTACK_DEVELOPMENT_MODE=false\nPAYSTACK_SANDBOX=false\n' >> .env

      - name: Build web release
        run: |
          flutter pub get
          flutter build web --release --base-href /

      # Flutter copies web/privacy.html into build/web, then registers every
      # output file with the service worker. The worker only rewrites "/" and
      # hash routes to index.html, but it still cache-handles any file it
      # knows about. Leave the privacy URLs to the network so a cached app
      # shell can never answer them.
      - name: Bypass the Flutter service worker for the privacy policy
        run: |
          python3 << 'PY'
          import re
          from pathlib import Path

          path = Path("build/web/flutter_service_worker.js")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(r'self\.addEventListener\(\s*"fetch"\s*,\s*\(event\)\s*=>\s*\{')
          match = pattern.search(text)
          if match is None or pattern.search(text, match.end()) is not None:
              raise SystemExit(
                  "Expected exactly one fetch handler in flutter_service_worker.js"
              )
          bypass = """
            var privacyOrigin = self.location.origin;
            var privacyPath = event.request.url.split("?")[0].split("#")[0];
            if (
              privacyPath === privacyOrigin + "/privacy.html" ||
              privacyPath === privacyOrigin + "/privacy" ||
              privacyPath === privacyOrigin + "/privacy/" ||
              privacyPath === privacyOrigin + "/privacy/index.html"
            ) {
              return;
            }
          """
          updated = text[: match.end()] + bypass + text[match.end() :]
          path.write_text(updated, encoding="utf-8")
          if "privacyOrigin + \"/privacy.html\"" not in updated:
              raise SystemExit("Privacy-policy service worker bypass was not written")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4